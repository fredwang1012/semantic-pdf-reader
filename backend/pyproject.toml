[project]
name = "semantic-pdf-reader-backend"
version = "0.1.0"
description = "Semantic PDF search reader backend: PDF text extraction, hybrid BM25 + dense search"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.28.2",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=6.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient warns that it prefers httpx2; the pinned httpx works, so keep the output clean.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
